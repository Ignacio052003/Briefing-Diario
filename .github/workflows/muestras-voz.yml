name: Muestras de voz

on:
  workflow_dispatch:
    inputs:
      velocidad:
        description: "Velocidad de lectura (por ejemplo +20%)"
        default: "+20%"

jobs:
  muestras:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python herramientas/muestras_voz.py muestras "${{ inputs.velocidad }}"
      - uses: actions/upload-artifact@v4
        with:
          name: muestras-voz
          path: muestras/
